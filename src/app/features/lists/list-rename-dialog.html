<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [dismissableMask]="true"
  [style]="{ width: '28rem', maxWidth: '92vw' }"
  [header]="t('lists.rename')"
>
  <div class="flex flex-col gap-1">
    <label for="renameListName" class="text-sm text-[var(--p-text-muted-color)]">
      {{ t('common.name') }}
    </label>
    <input
      pInputText
      id="renameListName"
      class="w-full"
      autocomplete="off"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      (keyup.enter)="save()"
    />
  </div>

  <ng-template #footer>
    <p-button [text]="true" [label]="t('common.cancel')" (onClick)="visible.set(false)" />
    <p-button
      [label]="t('common.save')"
      [disabled]="!canSave()"
      [loading]="saving()"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
